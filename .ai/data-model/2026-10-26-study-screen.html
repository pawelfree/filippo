<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model danych ekranu Nauka</title>
  <style>
    body{margin:0;font:16px system-ui,sans-serif;color:#20302a;background:#f7f9f6}
    header{padding:18px 24px;background:#fff;border-bottom:1px solid #d8e1d9}
    h1{font-size:22px;margin:0 0 6px}p{margin:0;color:#526258}
    svg{display:block;width:100%;height:70vh;min-height:390px;cursor:grab;touch-action:none}
    svg.dragging{cursor:grabbing}.edge{stroke:#759080;stroke-width:2}
    .edge-label{font-size:13px;fill:#456151}.node rect{stroke-width:2;rx:12}
    .node text{font-size:16px;font-weight:600;pointer-events:none}
    .node{cursor:pointer}.node:focus rect{stroke:#111;stroke-width:4}.muted{opacity:.2}
  </style>
</head>
<body>
  <header><h1>Ekran „Nauka”: relacje danych</h1><p>Przeciągnij, aby przesunąć; użyj kółka myszy, aby powiększyć. Kliknij węzeł, aby podświetlić jego bezpośrednie relacje; Escape przywraca całość.</p></header>
  <svg id="diagram" role="img" aria-label="StudyAttempt jest powiązany z LexicalSense oraz opcjonalnie z FsrsReview" viewBox="0 0 900 390"></svg>
  <script>
    const graph = {
      nodes: [
        {id:'entity_2',label:'LexicalSense',x:45,y:145,w:220,newEntity:false},
        {id:'entity_1',label:'StudyAttempt',x:340,y:145,w:220,newEntity:true},
        {id:'entity_3',label:'FsrsReview',x:635,y:145,w:220,newEntity:false}
      ],
      edges: [
        {from:'entity_2',to:'entity_1',label:'1–n'},
        {from:'entity_3',to:'entity_1',label:'0–1'}
      ]
    };
    const ns='http://www.w3.org/2000/svg';
    const svg=document.getElementById('diagram');
    const canvas=document.createElementNS(ns,'g');svg.append(canvas);
    const create=(tag,attrs={})=>{const el=document.createElementNS(ns,tag);for(const [key,value] of Object.entries(attrs))el.setAttribute(key,String(value));return el};
    const nodeEls=new Map(), edgeEls=[];
    for(const edge of graph.edges){
      const from=graph.nodes.find(node=>node.id===edge.from),to=graph.nodes.find(node=>node.id===edge.to);
      const left=from.x<to.x?from:to,right=left===from?to:from;
      const line=create('line',{x1:left.x+left.w,y1:left.y+30,x2:right.x,y2:right.y+30,class:'edge'});
      const label=create('text',{x:(left.x+left.w+right.x)/2,y:left.y+20,'text-anchor':'middle',class:'edge-label'});label.textContent=edge.label;
      canvas.append(line,label);edgeEls.push({edge,line,label});
    }
    for(const node of graph.nodes){
      const group=create('g',{class:'node',tabindex:'0',role:'button','aria-label':node.label});
      const rect=create('rect',{x:node.x,y:node.y,width:node.w,height:60,fill:node.newEntity?'#2f6feb':'#e5e7eb',stroke:node.newEntity?'#1b4fb0':'#9ca3af'});
      const label=create('text',{x:node.x+node.w/2,y:node.y+37,'text-anchor':'middle',fill:node.newEntity?'#fff':'#111'});label.textContent=node.label;
      group.append(rect,label);canvas.append(group);nodeEls.set(node.id,group);
      const focus=()=>{const near=new Set([node.id]);for(const edge of graph.edges){if(edge.from===node.id)near.add(edge.to);if(edge.to===node.id)near.add(edge.from)}for(const [id,element] of nodeEls)element.classList.toggle('muted',!near.has(id));for(const item of edgeEls){const dim=item.edge.from!==node.id&&item.edge.to!==node.id;item.line.classList.toggle('muted',dim);item.label.classList.toggle('muted',dim)}};
      group.addEventListener('click',focus);group.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();focus()}});
    }
    const clear=()=>{for(const element of nodeEls.values())element.classList.remove('muted');for(const item of edgeEls){item.line.classList.remove('muted');item.label.classList.remove('muted')}};
    document.addEventListener('keydown',event=>{if(event.key==='Escape')clear()});
    let scale=1,dx=0,dy=0,start=null;
    const render=()=>canvas.setAttribute('transform',`translate(${dx} ${dy}) scale(${scale})`);
    svg.addEventListener('wheel',event=>{event.preventDefault();scale=Math.max(.5,Math.min(3,scale*(event.deltaY<0?1.1:.9)));render()},{passive:false});
    svg.addEventListener('pointerdown',event=>{if(event.target.closest('.node'))return;start={x:event.clientX,y:event.clientY,dx,dy};svg.setPointerCapture(event.pointerId);svg.classList.add('dragging')});
    svg.addEventListener('pointermove',event=>{if(!start)return;dx=start.dx+(event.clientX-start.x);dy=start.dy+(event.clientY-start.y);render()});
    svg.addEventListener('pointerup',()=>{start=null;svg.classList.remove('dragging')});
  </script>
</body>
</html>
