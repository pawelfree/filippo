<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Filippo · Profil kompetencyjny</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/profile.css" />
    <script src="/profile.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">F</span><span>filippo <small>/ nauka</small></span></div>
      <nav class="page-nav" aria-label="Nawigacja główna">
        <a href="/">Taksonomia</a>
        <a class="current" href="/profile.html">Profil kompetencyjny</a>
      </nav>
    </header>
    <main class="shell profile-shell">
      <section class="intro profile-intro">
        <div>
          <p class="eyebrow">Stan nauki · włoski</p>
          <h1>Profil <em>kompetencyjny</em></h1>
          <p>Szacunki opanowania wariantów gramatycznych, poparte historią ćwiczeń. Nieocenione zagadnienia pozostają nieznane, a nie zerowe.</p>
        </div>
        <div class="profile-updated" id="updated"></div>
      </section>
      <section class="level-card" id="estimated-level" aria-label="Szacowany poziom użytkownika" hidden></section>
      <section class="profile-summary" id="summary" aria-label="Podsumowanie profilu"></section>
      <section class="model-note" id="model-note" hidden></section>
      <div id="error" class="error" role="alert" hidden></div>
      <section id="profile-browser" class="browser profile-browser" aria-label="Kompetencje według kategorii" hidden>
        <aside class="panel categories">
          <div class="panel-heading"><span>01 / Kategorie</span><span id="category-count"></span></div>
          <nav id="categories" aria-label="Kategorie gramatyczne"></nav>
        </aside>
        <section class="panel middle">
          <div class="panel-heading"><span>02 / Kompetencje</span><span id="competency-count"></span></div>
          <label class="search-label" for="search">Szukaj w kategorii</label>
          <input id="search" type="search" placeholder="Nazwa, definicja lub ID…" autocomplete="off" />
          <div id="competencies" class="list profile-list"></div>
        </section>
        <article class="panel detail profile-detail" id="detail" aria-live="polite"></article>
      </section>
    </main>
  </body>
</html>
